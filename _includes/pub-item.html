<li>
  <div class="pub-meta">
    <span class="pub-venue">{{ include.venue }}</span>
    <span class="pub-year">{{ include.year }}</span>
    {% if include.note %}<span class="pub-note">{{ include.note }}</span>{% endif %}
  </div>
  <div class="pub-body">
    {{ include.content | markdownify }}
  </div>
</li>
